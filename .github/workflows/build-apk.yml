name: Build Android TV APK

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            launcher/**/*.gradle*
            launcher/**/gradle-wrapper.properties
            launcher/gradle/libs.versions.toml

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "Android SDK directory not found: $ANDROID_HOME" >&2
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure launcher
        working-directory: launcher
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          TMDB_REGION: ${{ vars.TMDB_REGION }}
        shell: bash
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'tmdb.key=%s\n' "$TMDB_KEY"
            printf 'tmdb.region=%s\n' "$TMDB_REGION"
            printf 'tmdb.feed=all\n'
          } > local.properties

      - name: Build release APK
        working-directory: launcher
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flossing-tv-launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
